name: Build VLCKit

on: 
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'vlckit source url you want to build'
        required: false

jobs:
  build_with_signing:
    runs-on: macos-14
    steps:
      - name: 🛠️ Checkout repository
        run: |
          git clone https://github.com/saltpi/vlckit-sdk.git VLCKit

      - name: 🖥️ Select Xcode version
        run: |
          ls /Applications/
          sudo xcode-select --switch /Applications/Xcode_15.0.app
            
      - name: 🚀 Build app
        run: |
          cd VLCKit
          cd Packaging
          ./buildAndDeployFrameworks.sh      
