name: Build VLCKit

on: 
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'vlckit source url you want to build'
        required: false

jobs:
  prepare:
    runs-on: macos-14
    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
          repository: saltpi/vlckit-sdk
          path: VLCKit

      - name: 🖥️ Select Xcode version
        run: |
          ls /Applications/

      - name: 🏗️ Build base environment
        run: |
          cd VLCKit
          ./compileAndBuildVLCKit.sh -x

      - name: 💾 Save build environment
        uses: actions/upload-artifact@v4
        with:
          name: vlc-base
          path: VLCKit/
          retention-days: 1

  build_platforms:
    runs-on: macos-14
    needs: prepare
    strategy:
      matrix:
        platform: [macos, ios, tvos, watchos]
        include:
          - platform: macos
            build_args: -f
            package_args: -vm
          - platform: ios
            build_args: -fi
            package_args: -vi
          - platform: tvos
            build_args: -ft
            package_args: -vt
          - platform: watchos
            build_args: -fw
            package_args: -vw
    steps:
      - name: 📥 Restore build environment
        uses: actions/download-artifact@v4
        with:
          name: vlc-base
          path: VLCKit

      - name: 🚀 Build for ${{ matrix.platform }}
        run: |
          cd VLCKit
          ./compileAndBuildVLCKit.sh ${{ matrix.build_args }}
          ./Packaging/create-distributable-package.sh ${{ matrix.package_args }}

      - name: 📤 Upload ${{ matrix.platform }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLCKit-${{ matrix.platform }}
          path: VLCKit/VLCKit-${{ matrix.platform }}*.tar.xz

  list_artifacts:
    runs-on: macos-14
    needs: build_platforms
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 List built artifacts
        run: |
          find artifacts -name "*.xz" -o -name "*.zip" | sort
          echo "=== All artifacts ==="
          ls -la artifacts/*/
