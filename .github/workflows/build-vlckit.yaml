name: Build VLCKit

on: 
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'vlckit source url you want to build'
        required: false

jobs:
  build_with_signing:
    runs-on: macos-14
    steps:
      - name: 🛠️ Checkout repository
        run: |
          git clone https://github.com/saltpi/vlckit-sdk.git VLCKit

      - name: 🖥️ Select Xcode version
        run: |
          ls /Applications/
          # sudo xcode-select --switch /Applications/Xcode-15.4.0.app
            
      - name: 🚀 Build app
        run: |
          cd VLCKit
          ./compileAndBuildVLCKit.sh -x
          ./Packaging/create-distributable-package.sh -vx
          ls

      - name: 📤 Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          path: .
          
          
