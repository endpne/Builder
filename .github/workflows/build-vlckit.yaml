name: Build VLCKit

on: 
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'vlckit source url you want to build'
        required: false

jobs:
  build_platforms:
    runs-on: macos-14
    strategy:
      matrix:
        platform: [macos, ios, tvos, watchos]
        include:
          - platform: macos
            build_args: "-x"
            package_args: "-x"
          - platform: xros
            build_args: "-fi"
            package_args: "-i"
          - platform: ios
            build_args: "-f" 
            package_args: "-vm"
          - platform: tvos
            build_args: "-ft"
            package_args: "-vt"
          - platform: watchos
            build_args: "-fw"
            package_args: "-vw"
    steps:
      - name: 🛠️ Checkout repository
        run: |
          git clone https://github.com/saltpi/vlckit-sdk.git VLCKit

      - name: 🖥️ Select Xcode version
        run: |
          ls /Applications/

      - name: 🚀 Build for ${{ matrix.platform }}
        run: |
          cd VLCKit
          ./compileAndBuildVLCKit.sh ${{ matrix.build_args }}
          ./Packaging/create-distributable-package.sh ${{ matrix.package_args }}

      - name: 📤 Upload ${{ matrix.platform }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLCKit-${{ matrix.platform }}
          path: VLCKit/VLCKit-${{ matrix.platform }}*.tar.xz

  list_artifacts:
    runs-on: macos-14
    needs: build_platforms
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 List built artifacts
        run: |
          echo "=== All built artifacts ==="
          find artifacts -name "*.xz" -o -name "*.zip" | sort
          echo "=== File details ==="
          ls -la artifacts/*/
